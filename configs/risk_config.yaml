# 5) Ngưỡng & luật hành vi (CDR) để cộng level
# Bạn có thể map từ feature của bạn sang các field này.
behavior_rules:
  # Nhá máy / gọi cực ngắn (thường để dụ gọi lại)
  short_call_seconds: 5
  short_call_min_total: 2

  # Tỷ lệ gọi nhỡ cao
  miss_ratio_high: 0.60
  miss_ratio_min_total: 5

  # Tần suất gọi bất thường (nhiều lần/ngày) + thời lượng ngắn
  high_freq_per_day: 10
  high_freq_short_call_seconds: 10

  # Ít người gọi lại (độ tin cậy thấp)
  low_callback_rate: 0.10
  low_callback_min_total: 5

  # Ngoài giờ hành chính (nếu bạn có flag)
  outside_business_hour_level: 2

# 6) Điểm level từ rule (để không hard-code trong code)
rule_levels:
  hard_blacklist: 4
  intl_base: 2
  intl_prefix_boost_to: 3
  domestic_prefix_base: 2
  domestic_short_call_boost_to: 3
  behavior_miss_ratio_to: 3
  behavior_high_freq_to: 3
  behavior_low_callback_to: 2

# 7) Giảm level do whitelist/lịch sử tốt
whitelist_adjustments:
  in_contact_reduce: 2
  good_history_reduce: 1
  good_history_min_success_calls: 5
  good_history_min_avg_in_duration: 60

  # chặn giảm quá đà: nếu là số quốc tế thì không hạ dưới level này
  intl_min_level_after_reduce: 1

# 8) Message theo level (UI)
level_messages:
  "0":
    title: "✅ Có vẻ an toàn"
    subtitle: "Không phát hiện dấu hiệu bất thường."
  "1":
    title: "⚠️ Cần chú ý một chút"
    subtitle: "Có một vài dấu hiệu lạ, nhưng chưa đủ để xác định là spam."
  "2":
    title: "⚠️ Có dấu hiệu nghi vấn"
    subtitle: "Hệ thống phát hiện nhiều dấu hiệu giống cuộc gọi spam."
  "3":
    title: "🚫 Nguy cơ cao – Có thể là cuộc gọi lừa đảo"
    subtitle: "Số điện thoại này có nhiều đặc điểm trùng với các cuộc gọi spam đã được ghi nhận."
  "4":
    title: "🛑 Rất có thể là cuộc gọi lừa đảo"
    subtitle: "Số này trùng với mẫu hành vi spam/lừa đảo đã được hệ thống ghi nhận trước đó."

# 9) Gợi ý hành động theo level (để FE hiển thị nút)
actions_by_level:
  "0": ["Nghe máy", "Lưu liên hệ"]
  "1": ["Nghe thận trọng", "Báo cáo nếu nghi ngờ"]
  "2": ["Cẩn thận", "Không chia sẻ OTP/thông tin", "Báo cáo"]
  "3": ["Không nghe/Không gọi lại", "Báo cáo", "Chặn số"]
  "4": ["Chặn ngay", "Báo cáo", "Tôi biết số này (Not spam)"]

# 10) Template lý do (để giải thích)
reason_templates:
  model_score: "Điểm rủi ro từ mô hình: {score:.2f}."
  hard_blacklist: "Số này thuộc danh sách cảnh báo lừa đảo được ghi nhận."
  intl_any: "Cuộc gọi từ số quốc tế, cần cảnh giác."
  intl_prefix: "Đầu số quốc tế +{prefix} thường xuất hiện trong các cảnh báo lừa đảo."
  domestic_prefix: "Đầu số {prefix} thuộc nhóm nhạy cảm (cảnh báo mềm)."
  short_call: "Nhiều cuộc gọi rất ngắn (≤ {sec}s), giống hành vi nháy máy."
  miss_ratio: "Tỷ lệ cuộc gọi nhỡ cao ({ratio:.0%}), bất thường."
  high_freq: "Tần suất gọi cao ({freq}/ngày) và thời lượng ngắn, giống pattern spam."
  low_callback: "Tỷ lệ gọi lại thấp ({rate:.0%}), độ tin cậy thấp."
  outside_hour: "Cuộc gọi chủ yếu ngoài giờ hành chính."
  whitelist_reduce: "Đã giảm cảnh báo do số này thuộc danh bạ/lịch sử liên lạc tốt."
