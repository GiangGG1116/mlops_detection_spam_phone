# risk_config.yaml

# 1) Ngưỡng model → level
model_thresholds:
  # mỗi item là [threshold, level]
  # score < threshold => level
  - [0.30, 0]   # score < 0.30 → level 0
  - [0.50, 1]   # [0.30, 0.50)  → level 1
  - [0.70, 2]   # [0.50, 0.70)  → level 2
  - [0.85, 3]   # [0.70, 0.85)  → level 3
  - [1.01, 4]   # [0.85, 1.00]  → level 4

# 2) Rule: quốc tế
# Mọi số quốc tế đều có rủi ro nền (vì hay có pattern nhá máy / lừa đảo gọi lại).
# Giá trị là level tối thiểu khi detect số quốc tế.
intl_any_number_level: 2

# Các mã quốc gia (country code) thường xuất hiện trong danh sách cảnh báo → tăng level mạnh hơn
intl_risk_prefixes:
  - "224"
  - "231"
  - "232"
  - "247"
  - "252"
  - "255"
  - "370"
  - "371"
  - "375"
  - "381"
  - "563"

# 3) Rule: nội địa nhạy cảm (tín hiệu mềm, KHÔNG auto-spam)
domestic_risk_prefixes:
  - "1900"   # dịch vụ tính phí
  - "022"    # cố định, hay nhá máy (mở rộng)
  - "024"    # cố định, hay bị dùng trong scam/nhá máy
  - "026"
  - "028"

# 4) Số nằm trong blacklist cứng (từ báo/chuyên gia/nguồn công khai)
