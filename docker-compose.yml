services:
  # ── API service ────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: spam-phone-api:latest
    container_name: spam_phone_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Mount model and data dirs so the container sees live artifacts
      - ./models:/app/models
      - ./data:/app/data
      - ./configs:/app/configs
    environment:
      - PIPELINE_CONFIG=/app/configs/pipeline.yaml
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Point to the MLflow service inside compose network
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    command:
      [
        "uvicorn",
        "src.api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "2",
      ]
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── MLflow tracking server ──────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    container_name: spam_phone_mlflow
    restart: unless-stopped
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow
    command:
      [
        "mlflow",
        "server",
        "--backend-store-uri",
        "sqlite:////mlflow/mlflow.db",
        "--default-artifact-root",
        "/mlflow/artifacts",
        "--host",
        "0.0.0.0",
        "--port",
        "5000",
      ]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mlflow_data:
    driver: local
